<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌸 Stream Standings 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Quicksand', cursive, sans-serif;
    }

    body {
      background: transparent;
      padding: 16px;
      width: 400px;
      overflow: hidden;
    }

    /* ✨ Sparkles & Heart Magical Card ✨ */
    .card {
      background: rgba(255, 230, 242, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 3px solid rgba(255, 153, 204, 0.4);
      border-radius: 30px;
      padding: 20px 16px;
      box-shadow: 
        0 15px 35px rgba(255, 105, 180, 0.25),
        inset 0 0 15px rgba(255, 255, 255, 0.6);
      position: relative;
    }

    /* Adorable header decoration */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 12px 4px;
      border-bottom: 2px dashed rgba(255, 105, 180, 0.3);
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff409f, #b5179e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      filter: drop-shadow(0 2px 4px rgba(255, 105, 180, 0.15));
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .live-badge {
      background: linear-gradient(135deg, #ff4d8d, #ff85a1);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.8px;
      box-shadow: 0 4px 10px rgba(255, 77, 141, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 🌸 Pretty Rounded Row 🌸 */
    .row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      padding: 8px 14px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.15);
    }

    /* Extra bubbly hover/movement effects */
    .row:hover {
      transform: scale(1.02);
    }

    .rank {
      font-size: 1.05rem;
      font-weight: 700;
      color: #d84594;
      width: 32px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .name {
      flex: 1;
      font-size: 1.02rem;
      font-weight: 700;
      color: #4a3443;
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Super cute bubble score badge */
    .score {
      font-size: 1.05rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff5e97, #c052ff);
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 15px;
      min-width: 32px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255, 94, 151, 0.4);
      border: 2.5px solid rgba(255, 255, 255, 0.85);
    }

    /* 💖 Cute Highlights for Top 3 💖 */
    .row.pos-1 {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(255, 240, 245, 0.9));
      border-color: rgba(255, 133, 161, 0.8);
      box-shadow: 0 6px 15px rgba(255, 105, 180, 0.25);
    }
    .row.pos-1 .rank { 
      color: #ff3366; 
      font-size: 1.2rem;
    }
    .row.pos-1 .name {
      color: #a02052;
    }
    .row.pos-1 .score {
      background: linear-gradient(135deg, #ff3385, #ff3333);
      box-shadow: 0 4px 14px rgba(255, 51, 133, 0.5);
    }

    .row.pos-2 {
      border-color: rgba(216, 112, 147, 0.55);
      background: rgba(255, 245, 247, 0.8);
    }
    .row.pos-2 .rank { color: #db2777; }

    .row.pos-3 {
      border-color: rgba(186, 85, 211, 0.45);
      background: rgba(253, 242, 255, 0.8);
    }
    .row.pos-3 .rank { color: #a21caf; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <span class="title">✨ Standings ✨</span>
      <span class="live-badge">💖 LIVE</span>
    </div>
    <div class="list" id="playerList">
      <!-- Players render here -->
    </div>
  </div>

  <script>
    const BOARD_TOKEN = 'pfrksfhxkyrhr';
    const API_URL = `https://leaderboarded.com/api/${BOARD_TOKEN}/board/`;

    const container = document.getElementById('playerList');

function draw(players) {
      container.innerHTML = players.map((p, i) => {
        let badge = '#' + (i + 1);
        if (i === 0) badge = '👑';
        if (i === 1) badge = '🥈';
        if (i === 2) badge = '🥉';

        return `
          <div class="row ${i === 0 ? 'pos-1' : i === 1 ? 'pos-2' : i === 2 ? 'pos-3' : ''}">
            <span class="rank">${badge}</span>
            <span class="name">${p.name}</span>
            <span class="score">${p.score}</span>
          </div>
        `;
      }).join('');
    }

    async function fetchScores() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) return;

        const data = await res.json();
        const rawList = data.players || data.participants || [];

        if (rawList.length > 0) {
          const formatted = rawList.map(p => ({
            name: p.name || 'Player',
            score: Number(p.score ?? 0)
          }));

          formatted.sort((a, b) => b.score - a.score);
          draw(formatted);
        }
      } catch (err) {
        // Silently preserve current list on temporary network blips
      }
    }

    fetchScores();
    setInterval(fetchScores, 2000);
  </script>
</body>
</html>
